spring:
  application:
    name: clases-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymtrack_clases}
    username: ${DB_USER:gymtrack}
    password: ${DB_PASSWORD:gymtrack}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:gymtrack}
    password: ${RABBITMQ_PASSWORD:gymtrack}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true

server:
  port: 8082

miembros:
  base-url: ${MIEMBROS_BASE_URL:http://localhost:8081}
