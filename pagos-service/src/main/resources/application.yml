spring:
  application:
    name: pagos-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymtrack_pagos}
    username: ${DB_USER:gymtrack}
    password: ${DB_PASSWORD:gymtrack}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true

server:
  port: 8083