spring:
  application:
    name: pagos-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymtrack_pagos}
    username: ${DB_USER:gymtrack}
    password: ${DB_PASSWORD:gymtrack}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:gymtrack}
    password: ${RABBIT_PASSWORD:gymtrack}
    listener:
      simple:
        default-requeue-rejected: false
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2
          max-interval: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    connection-timeout: 2s
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
server:
  port: 8083
gymtrack:
  eventos:
    confirmar: true
    reintentos-auto: true
    reintento-ms: 5000
  pagos:
    validacion-timeout-ms: 2500
