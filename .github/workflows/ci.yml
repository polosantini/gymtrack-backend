name: CI backend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar backend con repositorio Maven limpio
        run: mvn -B -U "-Dmaven.repo.local=${RUNNER_TEMP}/m2-gymtrack" verify
