name: CI backend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar backend con repositorio Maven limpio
        run: mvn -B -U "-Dmaven.repo.local=${RUNNER_TEMP}/m2-gymtrack" verify

  validar-docker:
    name: Validar Docker y arranque
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validar compose y construir las tres imagenes sin publicar
        shell: bash
        run: |
          set -euo pipefail
          namespace="${GITHUB_REPOSITORY,,}"
          echo "GHCR_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=ci-$GITHUB_SHA" >> "$GITHUB_ENV"
          docker compose config --quiet
          for servicio in miembros-service clases-service pagos-service; do
            docker build --build-arg "SERVICIO=$servicio" --tag "ghcr.io/$namespace/$servicio:ci-$GITHUB_SHA" .
          done
      - name: Levantar la demo y comprobar HTTP
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --no-build
          for url in \
            'http://localhost:8081/api/miembros' \
            'http://localhost:8082/api/clases' \
            'http://localhost:8083/api/pagos?miembroId=6'; do
            curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --connect-timeout 5 --max-time 10 "$url"
          done
      - name: Probar catalogo y reservas con Pagos apagado (#40)
        shell: pwsh
        run: ./scripts/demo/probar-pagos-apagado.ps1
      - name: Conservar evidencia de disponibilidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-40-pagos-apagado-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/evidencias/40-pagos-apagado/ejecucion-docker.json
          if-no-files-found: warn
          retention-days: 30
      - name: Mostrar diagnostico si falla
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100
      - name: Limpiar los contenedores del runner
        if: always()
        run: docker compose down

  publicar-imagenes:
    name: Publicar ${{ matrix.servicio }} en GHCR
    needs: [ci, validar-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success' && needs['validar-docker'].result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        servicio: [miembros-service, clases-service, pagos-service]
    steps:
      - uses: actions/checkout@v4
      - name: Namespace GHCR en minusculas
        id: imagen
        shell: bash
        run: echo "repositorio=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Autenticar en GHCR con el token del workflow
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICIO=${{ matrix.servicio }}
          push: true
          tags: |
            ghcr.io/${{ steps.imagen.outputs.repositorio }}/${{ matrix.servicio }}:latest
            ghcr.io/${{ steps.imagen.outputs.repositorio }}/${{ matrix.servicio }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
