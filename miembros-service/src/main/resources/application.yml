spring:
  application:
    name: miembros-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymtrack_miembros}
    username: ${DB_USER:gymtrack}
    password: ${DB_PASSWORD:gymtrack}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: never

server:
  port: 8081