spring:
  application:
    name: miembros-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymtrack_miembros}
    username: ${DB_USER:gymtrack}
    password: ${DB_PASSWORD:gymtrack}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:gymtrack}
    password: ${RABBIT_PASSWORD:gymtrack}
    listener:
      simple:
        default-requeue-rejected: false
        acknowledge-mode: auto
        task:
          scheduling:
            pool:
              size: 1
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true

server:
  port: 8081

  gymtrack:
    vencimientos:
      cron: "0 0 8 * * *"
      zone: "America/Bogota"
      ventana-dias: 7